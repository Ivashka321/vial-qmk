name: Build QMK firmware

on:
  workflow_dispatch:
    inputs:
      keyboard:
        description: 'Keyboard'
        required: true
        default: 'myboard'
      keymap:
        description: 'Keymap'
        required: true
        default: 'vial'

  push:
    paths:
      - 'keyboards/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vial-kb/vial-qmk/vial_base:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        run: |
          make ${{ github.event.inputs.keyboard || 'myboard' }}:${{ github.event.inputs.keymap || 'vial' }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            *.uf2
            *.hex
            *.bin
