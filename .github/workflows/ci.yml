name: Build QMK firmware

on:
  workflow_dispatch:
    inputs:
      keyboard:
        description: 'Keyboard'
        required: true
        default: 'myboard'
      keymap:
        description: 'Keymap'
        required: true
        default: 'vial'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            python3 python3-pip \
            gcc unzip wget git
          pip3 install --user qmk

      - name: Setup QMK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          qmk setup --yes --home $(pwd)

      - name: Build firmware
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          qmk compile -kb ${{ github.event.inputs.keyboard }} -km ${{ github.event.inputs.keymap }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            **/*.uf2
            **/*.hex
            **/*.bin
